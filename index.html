<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8" />
  <!-- 修正：加上 user-scalable=yes + maximum-scale=5 讓手機縮放正常 -->
  <meta name="viewport"
    content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=5,user-scalable=yes" />
  <title>Blind Auction Party 🧧</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg1: #8d0010;
      --card: #a40016;
      --card-border: #ffd27d8c;
      --gold: #ffd27d;
      --gold-light: #ffe7c4;
      --gold-bright: #ffcb59;
      --text: #fff2e0;
      --text-dim: #ffe2b8;
      font-family: 'Noto Sans TC', system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    /* 確保手機觸控縮放正常 */
    html {
      touch-action: manipulation
    }

    body {
      color: var(--text);
      min-height: 100dvh;
      background: linear-gradient(165deg, #ffb4a2 0%, #cf1020 30%, #8d0010 100%);
      overflow-x: hidden
    }

    header {
      padding: 10px 16px;
      border-bottom: 1px solid #ffd27d55;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #7b0012dd;
      position: sticky;
      top: 0;
      z-index: 10
    }

    header .title {
      font-weight: 900;
      font-size: 18px
    }

    header .sub {
      color: var(--gold-light);
      font-size: 11px
    }

    main {
      padding: 12px;
      max-width: 640px;
      margin: 0 auto
    }

    .hidden {
      display: none !important
    }

    .card {
      background: linear-gradient(155deg, #b80018 0%, #8e0012 50%, #73000d 100%);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 6px 20px #3a000866;
      margin-bottom: 12px
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--gold);
      background: #74001099;
      color: var(--gold-light)
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--text-dim);
      margin: 8px 0 4px
    }

    input,
    select {
      background: #55000d;
      color: var(--text);
      border: 1px solid #ffcc7766;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 14px;
      outline: none;
      width: 100%
    }

    input:focus {
      border-color: var(--gold-bright);
      box-shadow: 0 0 0 2px #ffe29f33
    }

    button {
      background: linear-gradient(180deg, #ffcb59, #f8a400);
      color: #7a0009;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 900;
      font-size: 14px;
      transition: transform .1s
    }

    button:active {
      transform: scale(.96)
    }

    button.secondary {
      background: linear-gradient(180deg, #ff9f6a, #ff6f45);
      color: #61000d
    }

    button.danger {
      background: linear-gradient(180deg, #ff7b6e, #ff3232);
      color: #fff
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none
    }

    button.small {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 8px
    }

    .status-bar {
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      background: #6a000e;
      border: 1px solid #ffd27d44;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .status-bar .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6f6
    }

    .status-bar .dot.bad {
      background: #f66
    }

    .error-box {
      color: #ffd0d0;
      font-size: 12px;
      background: #55000d;
      border: 1px solid #ff434355;
      border-radius: 8px;
      padding: 8px;
      margin-top: 8px;
      white-space: pre-wrap;
      word-break: break-all
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    th,
    td {
      border-bottom: 1px solid #ffd27d33;
      padding: 7px 6px;
      font-size: 13px;
      text-align: left
    }

    th {
      color: var(--gold-light);
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase
    }

    .countdown {
      font-size: 64px;
      font-weight: 900;
      text-align: center;
      color: var(--gold-bright);
      text-shadow: 0 4px 20px #ff8c0066;
      line-height: 1;
      margin: 8px 0;
      font-variant-numeric: tabular-nums
    }

    .countdown.small {
      font-size: 32px
    }

    .result-panel {
      text-align: center;
      padding: 10px 0
    }

    .result-panel .winner-name {
      font-size: 28px;
      font-weight: 900;
      color: var(--gold-bright);
      text-shadow: 0 2px 12px #ffaa0066
    }

    .result-panel .detail {
      font-size: 14px;
      color: var(--text-dim);
      margin: 6px 0
    }

    .delta-positive {
      color: #a8ffb0;
      font-weight: 700
    }

    .delta-negative {
      color: #ffaaaa;
      font-weight: 700
    }

    .leaderboard .rank {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      margin: 4px 0;
      background: #65000d55;
      border: 1px solid #ffd27d22
    }

    .leaderboard .rank:first-child {
      background: #c8860033;
      border-color: var(--gold)
    }

    .leaderboard .rank-num {
      font-weight: 900;
      color: var(--gold);
      min-width: 24px;
      text-align: center
    }

    .leaderboard .rank-name {
      flex: 1;
      font-weight: 700
    }

    .leaderboard .rank-score {
      font-weight: 900;
      color: var(--gold-bright);
      font-size: 18px
    }

    .leaderboard .rank-budget {
      font-size: 11px;
      color: var(--text-dim)
    }

    .card-hand {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 8px 0
    }

    .card-item {
      background: linear-gradient(160deg, #d4a020, #b8860b);
      color: #3a0005;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 8px #5a000a55;
      transition: transform .15s;
      min-width: 80px;
      text-align: center
    }

    .card-item:hover {
      transform: translateY(-2px)
    }

    .card-item.used {
      opacity: .4;
      cursor: not-allowed
    }

    .card-item .card-count {
      font-size: 10px;
      opacity: .7
    }

    .player-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 8px;
      margin: 3px 0;
      background: #65000d44
    }

    .player-row .p-name {
      flex: 1;
      font-weight: 700;
      font-size: 14px
    }

    .player-row .p-stat {
      font-size: 12px;
      color: var(--text-dim)
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px
    }

    @media(max-width:420px) {
      .settings-grid {
        grid-template-columns: 1fr
      }
    }

    .festive {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden
    }

    .festive span {
      position: absolute;
      font-size: 28px;
      opacity: .6;
      animation: sway var(--d, 3s) ease-in-out infinite
    }

    @keyframes sway {

      0%,
      100% {
        transform: translateY(0) rotate(-6deg)
      }

      50% {
        transform: translateY(8px) rotate(6deg)
      }
    }

    .game-over {
      text-align: center;
      font-size: 32px;
      font-weight: 900;
      background: linear-gradient(90deg, var(--gold), #ff6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 16px 0 8px
    }

    .peek-hint {
      background: #d4a02033;
      border: 1px solid var(--gold);
      border-radius: 8px;
      padding: 8px 12px;
      margin: 6px 0;
      font-size: 13px;
      color: var(--gold-bright);
      text-align: center
    }

    .bid-confirm {
      background: #1a6b2033;
      border: 1px solid #6fff8844;
      border-radius: 8px;
      padding: 6px 10px;
      margin: 6px 0;
      font-size: 13px;
      color: #a8ffb0
    }

    .debug-toggle {
      font-size: 11px;
      color: var(--text-dim);
      cursor: pointer;
      text-decoration: underline;
      margin-top: 8px;
      display: inline-block
    }

    .log {
      max-height: 200px;
      overflow: auto;
      font-size: 11px;
      background: #3a000866;
      border: 1px solid #ffd27d22;
      border-radius: 8px;
      padding: 8px;
      white-space: pre-wrap;
      font-family: monospace;
      margin-top: 6px
    }
  </style>
</head>

<body>
  <!-- 節慶裝飾（精簡為 4 個，減少手機 GPU 負擔） -->
  <div class="festive" aria-hidden="true">
    <span style="left:5%;top:15%;--d:2.8s">🧧</span>
    <span style="left:85%;top:20%;--d:2.3s">🪙</span>
    <span style="left:48%;top:6%;--d:3.2s">💰</span>
    <span style="left:75%;top:70%;--d:2.6s">🏮</span>
  </div>

  <header>
    <div>
      <div class="title">🧧 盲拍派對</div>
      <div class="sub">Blind Auction Party</div>
    </div>
    <div style="text-align:right">
      <div class="sub" id="apiUrlText"></div>
    </div>
  </header>

  <main>
    <div class="status-bar">
      <div class="dot" id="statusDot"></div><span id="statusText">初始化中…</span>
    </div>

    <!-- ====== 大廳 ====== -->
    <div id="viewLobby">
      <div class="card">
        <h3>🏠 大廳</h3>
        <label>房名 / 同場域代碼</label>
        <input id="lobbyCode" placeholder="例：PARTY01" autocomplete="off" />
        <label>你的名字</label>
        <input id="playerName" placeholder="例：小明" autocomplete="off" />
        <div class="row" style="margin-top:12px">
          <button id="btnCreateRoom">🎉 開新房間</button>
          <button id="btnRefresh" class="secondary">🔄 刷新列表</button>
        </div>
        <div class="row" style="margin-top:8px">
          <button id="btnSetup" class="small secondary">初始化DB</button>
          <button id="btnDebug" class="small secondary">測試API</button>
        </div>
        <div id="lobbyError" class="error-box hidden"></div>
        <label style="margin-top:14px">用 roomId 直接加入</label>
        <div class="row">
          <input id="joinRoomId" placeholder="例：1234" style="flex:1" autocomplete="off" />
          <button id="btnJoinRoom" class="secondary">加入</button>
        </div>
      </div>
      <div class="card">
        <h3>📋 房間列表</h3>
        <table>
          <thead>
            <tr>
              <th>房號</th>
              <th>房名</th>
              <th>狀態</th>
              <th>人數</th>
              <th>回合</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="roomsTbody">
            <tr>
              <td colspan="6" style="font-size:12px;color:var(--text-dim)">載入中…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ====== 房間 ====== -->
    <div id="viewRoom" class="hidden">
      <!-- 房間資訊列（常駐） -->
      <div class="card" style="padding:10px 14px">
        <div class="row" style="justify-content:space-between">
          <div class="row" style="gap:6px">
            <span class="pill">房間</span>
            <b id="roomIdText" style="font-family:monospace;font-size:16px"></b>
            <span class="pill" id="roomStatePill">LOBBY</span>
            <span style="font-size:12px;color:var(--text-dim)">回合 <b id="roomRoundText">0</b>/<b
                id="roomMaxText">8</b></span>
          </div>
          <div class="row" style="gap:6px">
            <button id="btnResetDb" class="danger small hidden">重置DB</button>
            <button id="btnLeave" class="small secondary">離開</button>
          </div>
        </div>
        <div class="row" style="margin-top:6px;gap:12px">
          <span style="font-size:13px">👤 <b id="meNameText">-</b></span>
          <span style="font-size:13px">💰 <b id="meBudgetText">-</b></span>
          <span style="font-size:13px">⭐ <b id="meScoreText">-</b></span>
        </div>
      </div>

      <!-- LOBBY 狀態 -->
      <div id="stateLobby">
        <div class="card">
          <h3>👥 玩家列表</h3>
          <div id="playerListLobby">-</div>
        </div>
        <div class="card hidden" id="hostSettingsCard">
          <h3>⚙️ 房主設定</h3>
          <div class="settings-grid">
            <div><label>回合數</label><input id="setMaxRounds" type="number" min="1" max="20" value="8" /></div>
            <div><label>每回合秒數</label><input id="setRoundSeconds" type="number" min="5" max="120" value="25" /></div>
            <div><label>起始預算</label><input id="setStartBudget" type="number" min="10" max="9999" value="100" /></div>
          </div>
          <div class="row" style="margin-top:10px"><button id="btnSaveSettings" class="small secondary">💾 儲存設定</button>
          </div>
        </div>
        <div style="text-align:center;margin:12px 0"><button id="btnStartRound" class="hidden"
            style="font-size:18px;padding:14px 32px">🚀 開始回合</button></div>
      </div>

      <!-- BIDDING 狀態 -->
      <div id="stateBidding" class="hidden">
        <div class="card" style="text-align:center">
          <div style="font-size:13px;color:var(--text-dim)">本回合物品</div>
          <div style="font-size:22px;font-weight:900;margin:4px 0" id="bidItemName">-</div>
          <div style="font-size:14px;color:var(--gold-light)" id="bidItemHint">-</div>
          <div id="peekHintBox" class="peek-hint hidden"></div>
          <div class="countdown" id="bidCountdown">--</div>
          <div style="font-size:11px;color:var(--text-dim)">剩餘秒數</div>
        </div>
        <div class="card">
          <h3>💵 出價</h3>
          <div class="row"><input id="bidInput" type="number" min="0" step="1" placeholder="輸入金額"
              style="flex:1" /><button id="btnBid">送出出價</button></div>
          <div id="bidConfirmBox" class="bid-confirm hidden"></div>
          <div style="margin-top:10px">
            <div style="font-size:12px;color:var(--text-dim);margin-bottom:6px">🃏 手牌</div>
            <div class="card-hand" id="cardHandBidding"></div>
          </div>
          <div style="margin-top:10px"><button id="btnResolve" class="danger small hidden">⚡ 立即結算（Host）</button></div>
        </div>
        <div class="card">
          <h3>👥 玩家</h3>
          <div id="playerListBidding" style="font-size:12px">-</div>
        </div>
      </div>

      <!-- REVEAL 狀態 -->
      <div id="stateReveal" class="hidden">
        <div class="card">
          <div class="result-panel">
            <div style="font-size:14px;color:var(--text-dim)">🎊 本回合結果</div>
            <div id="revealItemName" style="font-size:18px;font-weight:700;margin:6px 0">-</div>
            <div style="font-size:13px;color:var(--text-dim)">真實價值：<b id="revealHiddenValue"
                style="color:var(--gold-bright)">?</b></div>
            <div style="margin:12px 0">
              <div style="font-size:13px;color:var(--text-dim)">🏆 得標者</div>
              <div class="winner-name" id="revealWinner">-</div>
              <div class="detail" id="revealDetail">-</div>
            </div>
            <div id="revealDeltas" style="font-size:13px"></div>
          </div>
          <div class="countdown small" id="revealCountdown">--</div>
          <div style="text-align:center;font-size:11px;color:var(--text-dim)">自動進入排行榜…</div>
        </div>
      </div>

      <!-- POSTROUND 狀態 -->
      <div id="statePostround" class="hidden">
        <div class="card">
          <h3>🏆 排行榜</h3>
          <div class="leaderboard" id="leaderboardBox">-</div>
        </div>
        <div style="text-align:center;margin:12px 0">
          <button id="btnNextRound" class="hidden" style="font-size:18px;padding:14px 32px">▶️ 下一回合</button>
          <div class="countdown small" id="postCountdown">--</div>
          <div style="font-size:11px;color:var(--text-dim)" id="postAutoText">自動進入下一回合…</div>
        </div>
      </div>

      <!-- ENDED 狀態 -->
      <div id="stateEnded" class="hidden">
        <div class="card">
          <div class="game-over">🎆 遊戲結束 🎆</div>
          <div class="leaderboard" id="leaderboardEndBox">-</div>
          <div style="text-align:center;margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
            <button id="btnRestart" class="hidden">🔄 重新開始（Host）</button>
            <button id="btnBackLobby" class="secondary">🏠 返回大廳</button>
          </div>
        </div>
      </div>

      <div id="roomError" class="error-box hidden"></div>
      <div><span class="debug-toggle" id="debugToggle">▶ Debug Log</span>
        <div class="log hidden" id="debugLog"></div>
      </div>
    </div>
  </main>

  <script>
    /* ══════════════════════════════════════════════════════════════════════════
     * API URL 偵測
     * - 優先用 Apps Script template 注入的 URL
     * - 其次用 ?api= query param（方便除錯）
     * - 最後 fallback 到當前 URL（本地測試用）
     * ════════════════════════════════════════════════════════════════════════ */
    const TEMPLATE_API_BASE = "<?= apiBaseUrl ?>";
    const API_URL = (function () {
      const t = String(TEMPLATE_API_BASE || "").trim();
      if (t && !/<%|<\?/.test(t)) return t; // template 已替換
      const u = new URL(location.href);
      const q = (u.searchParams.get("api") || "").trim();
      if (q) return q;
      u.hash = ""; u.searchParams.delete("api");
      const p = u.pathname.endsWith("/dev") ? u.pathname.replace(/\/dev$/, "/exec") : u.pathname;
      return u.origin + p;
    })();

    /* ══════════════════════════════════════════════════════════════════════════
     * DOM 快取（避免重複 getElementById，提升手機效能）
     * ════════════════════════════════════════════════════════════════════════ */
    const $ = id => document.getElementById(id);
    const DOM = {};
    [
      'apiUrlText', 'statusDot', 'statusText', 'viewLobby', 'viewRoom',
      'lobbyCode', 'playerName', 'btnCreateRoom', 'btnRefresh', 'btnSetup', 'btnDebug', 'btnJoinRoom', 'joinRoomId',
      'lobbyError', 'roomsTbody',
      'roomIdText', 'roomStatePill', 'roomRoundText', 'roomMaxText', 'meNameText', 'meBudgetText', 'meScoreText',
      'btnLeave', 'btnResetDb',
      'stateLobby', 'stateBidding', 'stateReveal', 'statePostround', 'stateEnded',
      'playerListLobby', 'hostSettingsCard', 'setMaxRounds', 'setRoundSeconds', 'setStartBudget',
      'btnSaveSettings', 'btnStartRound',
      'bidItemName', 'bidItemHint', 'peekHintBox', 'bidCountdown', 'bidInput', 'btnBid', 'bidConfirmBox',
      'cardHandBidding', 'btnResolve', 'playerListBidding',
      'revealItemName', 'revealHiddenValue', 'revealWinner', 'revealDetail', 'revealDeltas', 'revealCountdown',
      'leaderboardBox', 'btnNextRound', 'postCountdown', 'postAutoText',
      'leaderboardEndBox', 'btnRestart', 'btnBackLobby',
      'roomError', 'debugToggle', 'debugLog'
    ].forEach(id => DOM[id] = $(id));
    DOM.apiUrlText.textContent = API_URL.length > 60 ? "…" + API_URL.slice(-50) : API_URL;

    /* ══════════════════════════════════════════════════════════════════════════
     * 應用狀態
     * ════════════════════════════════════════════════════════════════════════ */
    const S = {
      roomId: "", playerId: "", hostToken: "", name: "",
      sinceEventId: 0,
      syncing: false,        // single-flight 防止同時多個 sync
      stop: false,           // 停止輪詢旗標
      preferJsonp: false,    // 若 fetch 失敗則自動切 JSONP
      lastState: "",         // 上一次渲染的狀態（用來判斷是否要重開倒數）
      countdownInterval: null,
      lastRenderHash: ""     // 用來跳過無變化的重繪
    };

    /* ══════════════════════════════════════════════════════════════════════════
     * 工具函式
     * ════════════════════════════════════════════════════════════════════════ */
    function setStatus(ok, msg) { DOM.statusText.textContent = msg; DOM.statusDot.className = ok ? "dot" : "dot bad"; }

    function showErr(id, msg) {
      const el = DOM[id]; if (!el) return;
      if (!msg) { el.classList.add('hidden'); el.textContent = ""; return; }
      el.classList.remove('hidden'); el.textContent = msg;
    }

    function logMsg(msg) {
      const b = DOM.debugLog;
      b.textContent = (b.textContent + "\n" + msg).trim();
      const l = b.textContent.split("\n");
      if (l.length > 150) b.textContent = l.slice(-150).join("\n");
      b.scrollTop = b.scrollHeight;
    }

    /** HTML 跳脫（防 XSS） */
    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    function looksLikeHtml(t) { const s = String(t || "").trim().toLowerCase(); return s.startsWith("<!doctype") || s.startsWith("<html") || s.includes("<head") || s.includes("<body"); }

    /** 正規化 lobbyCode（前後端邏輯一致） */
    function normLC(s) { s = String(s || "").trim(); if (!s) return ""; s = s.replace(/\s+/g, "").replace(/[a-z]/g, c => c.toUpperCase()); return s.length >= 2 ? s.slice(0, 16) : ""; }

    function must(s, name) { s = String(s || "").trim(); if (!s) throw new Error("請填入：" + name); return s; }

    /* ══════════════════════════════════════════════════════════════════════════
     * 網路層（fetch + JSONP fallback）
     * ════════════════════════════════════════════════════════════════════════ */
    function jsonpCb() { return "__BAP_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8); }

    function apiGETJsonp(action, params = {}) {
      return new Promise((res, rej) => {
        const u = new URL(API_URL); const cb = jsonpCb();
        u.searchParams.set("action", action); u.searchParams.set("callback", cb);
        u.searchParams.set("_t", String(Date.now()));
        for (const [k, v] of Object.entries(params)) { if (v == null || v === "") continue; u.searchParams.set(k, String(v)); }
        const sc = document.createElement("script"); let done = false;
        const to = setTimeout(() => fin(new Error("JSONP timeout")), 15000);
        function fin(e, d) { if (done) return; done = true; clearTimeout(to); if (sc.parentNode) sc.remove(); try { delete window[cb]; } catch (_) { } e ? rej(e) : res(d); }
        window[cb] = d => fin(null, d); sc.onerror = () => fin(new Error("JSONP failed")); sc.src = u.toString(); document.head.appendChild(sc);
      });
    }

    function isNetErr(e) { const m = String(e && e.message || e || "").toLowerCase(); return m.includes("network") || m.includes("failed to fetch") || m.includes("load failed"); }

    async function apiGET(action, params = {}) {
      if (S.preferJsonp) return apiGETJsonp(action, params);
      const u = new URL(API_URL); u.searchParams.set("action", action);
      u.searchParams.set("_t", String(Date.now()));
      for (const [k, v] of Object.entries(params)) { if (v == null || v === "") continue; u.searchParams.set(k, String(v)); }
      try {
        const r = await fetch(u.toString(), { method: "GET", credentials: "include", cache: "no-store" });
        const t = await r.text();
        if (looksLikeHtml(t)) throw new Error("API returned HTML");
        return JSON.parse(t);
      } catch (e) {
        logMsg("GET→JSONP " + action); if (isNetErr(e)) S.preferJsonp = true;
        return apiGETJsonp(action, params);
      }
    }

    async function apiPOST(action, payload = {}) {
      try {
        const r = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "include", body: JSON.stringify({ action, ...payload }) });
        const t = await r.text();
        if (looksLikeHtml(t)) { logMsg("POST→GET " + action); return apiGET(action, payload); }
        return JSON.parse(t);
      } catch (e) { logMsg("POST→GET " + action); return apiGET(action, payload); }
    }

    /* ══════════════════════════════════════════════════════════════════════════
     * 畫面切換
     * ════════════════════════════════════════════════════════════════════════ */
    function showLobby() { DOM.viewLobby.classList.remove('hidden'); DOM.viewRoom.classList.add('hidden'); stopSync(); }
    function showRoom() { DOM.viewLobby.classList.add('hidden'); DOM.viewRoom.classList.remove('hidden'); }

    /** 根據房間 state 顯示對應面板 */
    function showRoomState(state) {
      ['stateLobby', 'stateBidding', 'stateReveal', 'statePostround', 'stateEnded'].forEach(id => DOM[id].classList.add('hidden'));
      const map = { LOBBY: 'stateLobby', BIDDING: 'stateBidding', REVEAL: 'stateReveal', POSTROUND: 'statePostround', ENDED: 'stateEnded' };
      DOM[map[state] || 'stateLobby'].classList.remove('hidden');
      if (state !== S.lastState) { clearCountdown(); S.lastState = state; }
    }

    /* ══════════════════════════════════════════════════════════════════════════
     * 大廳操作
     * ════════════════════════════════════════════════════════════════════════ */
    const stateLabel = { LOBBY: '🟢 等待中', BIDDING: '🔴 出價中', REVEAL: '🟡 揭露中', POSTROUND: '📊 排行', ENDED: '🏁 結束' };

    function renderRooms(rooms) {
      const tb = DOM.roomsTbody; tb.innerHTML = "";
      if (!rooms.length) { tb.innerHTML = '<tr><td colspan="6" style="font-size:12px;color:var(--text-dim)">沒有活躍房間</td></tr>'; return; }
      rooms.forEach(r => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td style="font-family:monospace;font-weight:700">${r.roomId}</td><td style="font-size:12px">${esc(r.lobbyCode || '')}</td><td style="font-size:12px">${stateLabel[r.state] || r.state}</td><td>${r.playerCount || 0}</td><td>${r.round || 0}/${r.maxRounds || 0}</td><td><button class="small secondary">加入</button></td>`;
        tr.querySelector("button").onclick = () => joinRoomById(r.roomId);
        tb.appendChild(tr);
      });
    }

    let lobbyBusy = false;
    function setLobbyBusy(v) { lobbyBusy = !!v; DOM.btnRefresh.disabled = lobbyBusy; DOM.btnCreateRoom.disabled = lobbyBusy; DOM.btnJoinRoom.disabled = lobbyBusy; }

    /** 刷新房間列表（lobbyCode 可選：有填則過濾，空則顯示全部） */
    async function refreshLobby() {
      showErr('lobbyError', '');
      if (lobbyBusy) return;
      const lc = normLC(DOM.lobbyCode.value);  // 可能為空字串
      setLobbyBusy(true);
      try {
        setStatus(true, '載入房間列表…');
        const params = {};
        if (lc) params.lobbyCode = lc;  // 有填才傳，空值則列出全部
        const out = await apiGET("listLobbyRooms", params);
        if (!out.ok) throw new Error(out.error || "listLobbyRooms failed");
        renderRooms(out.rooms || []);
        setStatus(true, '大廳就緒（' + (out.rooms || []).length + ' 間房）');
      } catch (err) {
        showErr('lobbyError', String(err.message || err));
        setStatus(false, '刷新失敗');
        logMsg("REFRESH_ERR: " + String(err.message || err));
      } finally { setLobbyBusy(false); }
    }

    /** 建立新房間 + 自動加入 */
    async function createRoom() {
      showErr('lobbyError', '');
      const lc = normLC(must(DOM.lobbyCode.value, '房名'));
      if (!lc) throw new Error("房名至少 2 個字");
      const name = must(DOM.playerName.value, '你的名字').slice(0, 18);
      setStatus(true, '建立房間…');
      const cr = await apiPOST("createRoom", { lobbyCode: lc });
      if (!cr.ok) throw new Error(cr.error || "createRoom failed");
      const jr = await apiPOST("joinRoom", { roomId: cr.roomId, name, hostToken: cr.hostToken || "" });
      if (!jr.ok) throw new Error(jr.error || "joinRoom failed");
      S.roomId = cr.roomId; S.hostToken = cr.hostToken || ""; S.playerId = jr.playerId || ""; S.name = name; S.sinceEventId = 0;
      enterRoom();
    }

    /** 以 roomId 加入房間 */
    async function joinRoomById(roomId) {
      showErr('lobbyError', '');
      const name = must(DOM.playerName.value, '你的名字').slice(0, 18);
      roomId = must(roomId, 'roomId').trim();
      setStatus(true, '加入房間…');
      const jr = await apiPOST("joinRoom", { roomId, name });
      if (!jr.ok) throw new Error(jr.error || "joinRoom failed");
      S.roomId = roomId; S.hostToken = ""; S.playerId = jr.playerId || ""; S.name = name; S.sinceEventId = 0;
      enterRoom();
    }

    function enterRoom() {
      showRoom();
      DOM.roomIdText.textContent = S.roomId; DOM.meNameText.textContent = S.name;
      DOM.debugLog.textContent = ""; showErr('roomError', '');
      startSync();
    }

    /* ══════════════════════════════════════════════════════════════════════════
     * 倒數計時器
     * ════════════════════════════════════════════════════════════════════════ */
    function clearCountdown() { if (S.countdownInterval) { clearInterval(S.countdownInterval); S.countdownInterval = null; } }

    function startCountdown(elId, deadlineMs) {
      clearCountdown();
      const el = DOM[elId];
      function tick() {
        const rem = Math.max(0, Math.ceil((deadlineMs - Date.now()) / 1000));
        el.textContent = rem;
      }
      tick();
      S.countdownInterval = setInterval(tick, 500);
    }

    /* ══════════════════════════════════════════════════════════════════════════
     * 渲染輔助
     * ════════════════════════════════════════════════════════════════════════ */
    function renderPlayerList(id, players, amHost) {
      const el = DOM[id]; if (!el) return;
      if (!players || !players.length) { el.innerHTML = '<div style="font-size:12px;color:var(--text-dim)">尚無玩家</div>'; return; }
      el.innerHTML = players.map(p => {
        const isSelf = p.playerId === S.playerId;
        const kickBtn = (amHost && !p.isHost && !isSelf)
          ? ` <button class="kick-btn" data-pid="${p.playerId}" style="background:none;border:none;cursor:pointer;font-size:14px;padding:0 4px" title="踢除玩家">❌</button>`
          : '';
        return `<div class="player-row"><span class="p-name">${p.isHost ? '👑 ' : ''}${esc(p.name)}${isSelf ? ' (你)' : ''}${kickBtn}</span><span class="p-stat">💰 ${p.budget}</span><span class="p-stat">⭐ ${p.score}</span></div>`;
      }).join('');
      // 綁定踢除按鈕
      el.querySelectorAll('.kick-btn').forEach(btn => {
        btn.onclick = async () => {
          const tid = btn.dataset.pid;
          if (!confirm('確定要踢除此玩家嗎？')) return;
          try {
            const o = await apiPOST("kickPlayer", { roomId: S.roomId, hostToken: S.hostToken, playerId: S.playerId, targetPlayerId: tid });
            if (!o.ok) throw new Error(o.error || "kickPlayer failed");
            S.lastRenderHash = "";
          } catch (e) { showErr('roomError', String(e.message || e)); }
        };
      });
    }

    function renderLeaderboard(id, players) {
      const el = DOM[id]; if (!el) return;
      const sorted = [...players].sort((a, b) => b.score - a.score);
      const medals = ['🥇', '🥈', '🥉'];
      el.innerHTML = sorted.map((p, i) => `<div class="rank"><span class="rank-num">${medals[i] || (i + 1)}</span><span class="rank-name">${p.isHost ? '👑 ' : ''}${esc(p.name)}${p.playerId === S.playerId ? ' (你)' : ''}</span><span><span class="rank-score">⭐ ${p.score}</span> <span class="rank-budget">💰 ${p.budget}</span></span></div>`).join('');
    }

    function renderCardHand(id, cards, round, state) {
      const el = DOM[id]; if (!el) return;
      if (!cards || !cards.length) { el.innerHTML = '<span style="font-size:12px;color:var(--text-dim)">無手牌</span>'; return; }
      el.innerHTML = cards.map(c => {
        const ok = c.count > 0 && state === 'BIDDING';
        return `<div class="card-item${ok ? '' : ' used'}" data-card="${c.cardId}" data-round="${round}"${ok ? '' : ' style="pointer-events:none"'}><div>${esc(c.name)}</div><div class="card-count">x${c.count}</div></div>`;
      }).join('');
      el.querySelectorAll('.card-item:not(.used)').forEach(el => {
        el.onclick = async () => {
          const cardId = el.dataset.card, rd = Number(el.dataset.round);
          try { el.classList.add('used'); const o = await apiPOST("playCard", { roomId: S.roomId, playerId: S.playerId, round: rd, cardId }); if (!o.ok) throw new Error(o.error); }
          catch (e) { showErr('roomError', String(e.message || e)); }
        };
      });
    }

    /* ══════════════════════════════════════════════════════════════════════════
     * 同步輪詢（每 2 秒）
     * ════════════════════════════════════════════════════════════════════════ */
    function stopSync() { S.stop = true; clearCountdown(); }

    function startSync() {
      S.stop = false;
      (async function loop() {
        while (!S.stop) {
          try { await syncOnce(); } catch (e) { showErr('roomError', String(e.message || e)); setStatus(false, '同步失敗'); logMsg("SYNC_ERR: " + String(e.message || e)); await new Promise(r => setTimeout(r, 3000)); }
          await new Promise(r => setTimeout(r, 2000));
        }
      })();
    }

    /** 單次同步：呼叫後端 sync API，更新 UI */
    async function syncOnce() {
      if (S.syncing) return; S.syncing = true;
      try {
        const out = await apiGET("sync", { roomId: S.roomId, sinceEventId: S.sinceEventId, playerId: S.playerId, hostToken: S.hostToken });
        if (!out.ok) throw new Error(out.error || "sync failed");
        const room = out.room, players = out.players || [], myCards = out.myCards || [], rr = out.resolveResult, peek = out.peekHint, myBid = out.myBid;

        // 跳過無變化的重繪（用 hash 比對）
        const hash = JSON.stringify({ s: room.state, r: room.round, bd: room.bidDeadlineTs, rv: room.revealUntilTs, pt: room.postUntilTs, win: rr ? rr.winnerId : '', mb: myBid, pl: players.map(p => p.playerId + p.budget + p.score).join(',') });
        const evts = out.events || [];
        if (hash === S.lastRenderHash) {
          if (evts.length) { const mx = Math.max(...evts.map(e => e.eventId || 0)); if (mx > S.sinceEventId) S.sinceEventId = mx; }
          return;
        }
        S.lastRenderHash = hash;

        // ── 房間 header ──
        DOM.roomStatePill.textContent = stateLabel[room.state] || room.state;
        DOM.roomRoundText.textContent = String(room.round || 0);
        DOM.roomMaxText.textContent = String(room.maxRounds || 0);
        const me = players.find(p => p.playerId === S.playerId);

        // 偵測被踢：若自己不在玩家列表中，自動跳回大廳
        if (!me && S.playerId) {
          showLobby();
          S.roomId = ""; S.playerId = ""; S.hostToken = ""; S.sinceEventId = 0; S.lastRenderHash = "";
          setStatus(false, '你已被踢出房間');
          alert('你已被房主踢出房間');
          setTimeout(refreshLobby, 300);
          return;
        }
        DOM.meBudgetText.textContent = me ? String(me.budget) : "-";
        DOM.meScoreText.textContent = me ? String(me.score) : "-";
        const amHost = !!(S.hostToken || (me && me.isHost));
        DOM.btnResetDb.classList.toggle('hidden', !S.hostToken);

        // ── 切換面板 ──
        showRoomState(room.state);

        // ── LOBBY ──
        if (room.state === "LOBBY") {
          renderPlayerList('playerListLobby', players, amHost);
          DOM.btnStartRound.classList.toggle('hidden', !amHost || players.length < 2);
          DOM.hostSettingsCard.classList.toggle('hidden', !amHost);
          if (amHost) {
            if (document.activeElement !== DOM.setMaxRounds) DOM.setMaxRounds.value = room.maxRounds;
            if (document.activeElement !== DOM.setRoundSeconds) DOM.setRoundSeconds.value = room.roundSeconds;
            if (document.activeElement !== DOM.setStartBudget) DOM.setStartBudget.value = room.startingBudget;
          }
        }

        // ── BIDDING ──
        if (room.state === "BIDDING") {
          if (room.item) { DOM.bidItemName.textContent = room.item.name || "-"; DOM.bidItemHint.textContent = room.item.publicHint || ""; }
          if (peek) { DOM.peekHintBox.classList.remove('hidden'); DOM.peekHintBox.textContent = `🔮 偷看提示：真實價值在 ${peek.min} ~ ${peek.max} 之間`; } else { DOM.peekHintBox.classList.add('hidden'); }
          if (room.bidDeadlineTs > 0 && !S.countdownInterval) startCountdown('bidCountdown', room.bidDeadlineTs);
          if (myBid != null) { DOM.bidConfirmBox.classList.remove('hidden'); DOM.bidConfirmBox.textContent = `✅ 你已出價：${myBid}`; } else { DOM.bidConfirmBox.classList.add('hidden'); }
          renderCardHand('cardHandBidding', myCards, room.round, room.state);
          DOM.btnResolve.classList.toggle('hidden', !amHost);
          renderPlayerList('playerListBidding', players, amHost);
        }

        // ── REVEAL ──
        if (room.state === "REVEAL" && rr) {
          DOM.revealItemName.textContent = rr.itemName || "-";
          DOM.revealHiddenValue.textContent = String(rr.hiddenValue || "?");
          if (rr.winnerId) {
            DOM.revealWinner.textContent = rr.winnerName || rr.winnerId;
            let det = `出價 ${rr.winnerBid}`;
            if (rr.taxApplied) det += `（加稅後實付 ${rr.actualCost}）`;
            const d = rr.deltas && rr.deltas[rr.winnerId];
            if (d) { const cls = d.delta >= 0 ? 'delta-positive' : 'delta-negative'; det += ` → 分數 <span class="${cls}">${d.delta >= 0 ? '+' : ''}${d.delta}</span>`; if (d.shieldApplied) det += ' 🛡️護盾生效！'; }
            DOM.revealDetail.innerHTML = det;
          } else { DOM.revealWinner.textContent = "無人得標"; DOM.revealDetail.textContent = "所有人出價超過預算或無人出價"; }
          let dh = ''; players.forEach(p => { const d = rr.deltas && rr.deltas[p.playerId]; if (d) { const c = d.delta >= 0 ? 'delta-positive' : 'delta-negative'; dh += `<div>${esc(p.name)}: <span class="${c}">${d.delta >= 0 ? '+' : ''}${d.delta}</span></div>`; } });
          DOM.revealDeltas.innerHTML = dh;
          if (room.revealUntilTs > 0 && !S.countdownInterval) startCountdown('revealCountdown', room.revealUntilTs);
        }

        // ── POSTROUND ──
        if (room.state === "POSTROUND") {
          renderLeaderboard('leaderboardBox', players);
          DOM.btnNextRound.classList.toggle('hidden', !amHost);
          DOM.postAutoText.textContent = amHost ? "Host 可手動開始下一回合" : "自動進入下一回合…";
          if (room.postUntilTs > 0 && !S.countdownInterval) startCountdown('postCountdown', room.postUntilTs);
        }

        // ── ENDED ──
        if (room.state === "ENDED") { renderLeaderboard('leaderboardEndBox', players); DOM.btnRestart.classList.toggle('hidden', !amHost); }

        // ── 事件增量 ──
        if (evts.length) {
          const mx = Math.max(...evts.map(e => e.eventId || 0));
          if (mx > S.sinceEventId) S.sinceEventId = mx;
          evts.forEach(ev => logMsg(`#${ev.eventId} ${ev.type} ${ev.playerId || ""} ${ev.payloadJson || ""}`));
        }
        setStatus(true, "同步中… " + (stateLabel[room.state] || room.state));
      } finally { S.syncing = false; }
    }

    /* ══════════════════════════════════════════════════════════════════════════
     * 遊戲操作
     * ════════════════════════════════════════════════════════════════════════ */
    async function sendBid() {
      showErr('roomError', '');
      const bid = Number(DOM.bidInput.value);
      if (!Number.isFinite(bid) || bid < 0) throw new Error("出價必須 ≥ 0");
      const round = Number(DOM.roomRoundText.textContent || 0);
      const o = await apiPOST("bid", { roomId: S.roomId, playerId: S.playerId, round, bid });
      if (!o.ok) throw new Error(o.error || "bid failed");
      DOM.bidConfirmBox.classList.remove('hidden'); DOM.bidConfirmBox.textContent = `✅ 你已出價：${bid}`;
      S.lastRenderHash = "";
    }

    async function startRoundHost() {
      showErr('roomError', '');
      const o = await apiPOST("startRound", { roomId: S.roomId, hostToken: S.hostToken, playerId: S.playerId });
      if (!o.ok) throw new Error(o.error || "startRound failed");
      S.lastRenderHash = "";
    }

    async function resolveHost() {
      showErr('roomError', '');
      const o = await apiPOST("resolve", { roomId: S.roomId, hostToken: S.hostToken, playerId: S.playerId });
      if (!o.ok) throw new Error(o.error || "resolve failed");
      S.lastRenderHash = "";
    }

    async function saveSettings() {
      showErr('roomError', '');
      const o = await apiPOST("updateSettings", { roomId: S.roomId, hostToken: S.hostToken, playerId: S.playerId, maxRounds: Number(DOM.setMaxRounds.value || 8), roundSeconds: Number(DOM.setRoundSeconds.value || 25), startingBudget: Number(DOM.setStartBudget.value || 100) });
      if (!o.ok) throw new Error(o.error || "updateSettings failed");
      setStatus(true, '設定已儲存'); S.lastRenderHash = "";
    }

    async function resetDb() {
      showErr('roomError', '');
      if (!S.hostToken) throw new Error("只有房主可以重置");
      if (!confirm("確定要重置所有資料嗎？")) return;
      const o = await apiPOST("resetDatabase", { roomId: S.roomId, hostToken: S.hostToken });
      if (!o.ok) throw new Error(o.error || "reset failed");
      showLobby(); S.roomId = ""; S.playerId = ""; S.hostToken = ""; S.sinceEventId = 0; S.lastRenderHash = "";
      setStatus(true, '資料庫已重置');
    }

    /* ══════════════════════════════════════════════════════════════════════════
     * 按鈕綁定（統一 try/catch 包裝）
     * ════════════════════════════════════════════════════════════════════════ */
    function wire(id, fn) {
      DOM[id].onclick = async () => {
        try { await fn(); } catch (e) {
          const t = DOM.viewRoom.classList.contains('hidden') ? 'lobbyError' : 'roomError';
          showErr(t, String(e.message || e)); setStatus(false, '操作失敗'); logMsg("ERR: " + String(e.message || e));
        }
      };
    }

    wire('btnRefresh', refreshLobby);
    wire('btnCreateRoom', createRoom);
    wire('btnJoinRoom', () => joinRoomById(DOM.joinRoomId.value));
    wire('btnLeave', async () => {
      showLobby(); setStatus(true, '回到大廳');
      setTimeout(refreshLobby, 300);  // 離開後自動刷新房間列表
    });
    wire('btnBid', sendBid);
    wire('btnStartRound', startRoundHost);
    wire('btnResolve', resolveHost);
    wire('btnNextRound', startRoundHost);   // 複用 startRound
    wire('btnResetDb', resetDb);
    wire('btnSaveSettings', saveSettings);
    wire('btnRestart', async () => {
      // Host 重新開始遊戲（不離開房間）
      showErr('roomError', '');
      const o = await apiPOST("restartGame", { roomId: S.roomId, hostToken: S.hostToken, playerId: S.playerId });
      if (!o.ok) throw new Error(o.error || "restartGame failed");
      S.lastRenderHash = ""; setStatus(true, '遊戲已重新開始');
    });
    wire('btnBackLobby', async () => {
      showLobby(); setStatus(true, '回到大廳');
      setTimeout(refreshLobby, 300);
    });
    wire('btnSetup', async () => { showErr('lobbyError', ''); setStatus(true, '初始化DB…'); const o = await apiPOST("setup", {}); if (!o.ok) throw new Error(o.error); setStatus(true, 'DB 初始化完成'); setTimeout(refreshLobby, 500); });
    wire('btnDebug', async () => { showErr('lobbyError', ''); setStatus(true, '測試 API…'); const o = await apiGET("debugInfo", {}); if (!o.ok) throw new Error(o.error); setStatus(true, 'API OK ✓'); logMsg("DEBUG:\n" + JSON.stringify(o, null, 2)); });

    // Debug log 折疊
    DOM.debugToggle.onclick = () => { DOM.debugLog.classList.toggle('hidden'); DOM.debugToggle.textContent = DOM.debugLog.classList.contains('hidden') ? '▶ Debug Log' : '▼ Debug Log'; };

    /* ══════════════════════════════════════════════════════════════════════════
     * 初始化
     * ════════════════════════════════════════════════════════════════════════ */
    (async function init() {
      try { const u = new URL(location.href); const r = u.searchParams.get("roomId"); if (r) DOM.joinRoomId.value = r; } catch (_) { }
      // 頁面載入時自動初始化 DB（確保表存在 + items 已 seed）再刷新房間列表
      try {
        setStatus(true, '初始化中…');
        await apiPOST("setup", {});
      } catch (_) { /* setup 失敗不擋刷新 */ }
      setStatus(true, '大廳就緒');
      refreshLobby();
    })();

    // 全域錯誤攔截（避免靜默失敗）
    window.addEventListener("unhandledrejection", e => logMsg("UNHANDLED: " + String(e.reason?.message || e.reason || "")));
    window.addEventListener("error", e => logMsg("ERROR: " + String(e.message || "")));
  </script>
</body>

</html>
