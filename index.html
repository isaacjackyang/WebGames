<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Blind Auction Party</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans TC",Arial,sans-serif}
    body{
      margin:0;
      color:#fff2e0;
      min-height:100vh;
      background:radial-gradient(circle at 20% 10%,#ffb4a2 0%,#cf1020 38%,#8d0010 100%);
      position:relative;
      overflow-x:hidden;
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 12% 80%,rgba(255,220,127,.2) 0 18%,transparent 25%),
        radial-gradient(circle at 90% 24%,rgba(255,220,127,.2) 0 16%,transparent 26%),
        radial-gradient(circle at 50% 4%,rgba(255,245,192,.12) 0 14%,transparent 22%);
      z-index:0;
    }
    header{padding:14px 16px;border-bottom:1px solid #ffd27d66;display:flex;justify-content:space-between;gap:12px;align-items:center;background:#7b0012cc;position:sticky;top:0;z-index:3;backdrop-filter:blur(4px)}
    .small{color:#ffe7c4;font-size:12px}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    main{padding:16px;max-width:980px;margin:0 auto}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    .card{background:linear-gradient(155deg,#a40016 0%,#8e0012 45%,#73000d 100%);border:1px solid #ffd27d8c;border-radius:12px;padding:14px;box-shadow:0 8px 18px #4f000b66;position:relative;z-index:2}
    h3{margin:0 0 10px}
    label{display:block;font-size:12px;color:#ffe2b8;margin:10px 0 6px}
    input{background:#65000f;color:#fff2e0;border:1px solid #ffcc7790;border-radius:10px;padding:10px 12px;outline:none}
    input:focus{border-color:#ffe29f;box-shadow:0 0 0 2px #ffe29f36}
    button{background:linear-gradient(180deg,#ffcb59,#f8a400);color:#7a0009;border:none;border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:900}
    button.secondary{background:linear-gradient(180deg,#ff9f6a,#ff6f45);color:#61000d}
    button.danger{background:linear-gradient(180deg,#ff7b6e,#ff3232);color:#4b0008}
    button:disabled{opacity:.55;cursor:not-allowed}
    .status{padding:10px 12px;border-radius:10px;background:#7f0011;border:1px solid #ffd27d99;position:relative;z-index:2}
    .ok{color:#c7ffbe}.bad{color:#ffe1e1}
    .hint{color:#ffe7c4;font-size:12px;margin-top:6px;white-space:pre-wrap}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media (max-width:860px){.grid2{grid-template-columns:1fr}}
    table{width:100%;border-collapse:collapse}
    th,td{border-bottom:1px solid #ffd27d55;padding:8px 6px;font-size:13px;text-align:left}
    th{color:#ffe7c4;font-weight:800}
    .log{max-height:260px;overflow:auto;font-size:12px;background:#65000f;border:1px solid #ffd27d66;border-radius:10px;padding:10px;white-space:pre-wrap}
    .pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;border:1px solid #ffd27d88;background:#740010;color:#ffe2b8}

    .festive-layer{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
    .floaty{position:absolute;font-size:34px;filter:drop-shadow(0 4px 6px rgba(65,0,0,.5));animation:sway var(--dur) ease-in-out infinite;transform-origin:center top;opacity:.9}
    .floaty.small{font-size:28px;opacity:.82}
    @keyframes sway{
      0%,100%{transform:translateY(0) rotate(-8deg)}
      50%{transform:translateY(12px) rotate(8deg)}
    }
  </style>
</head>
<body>
<div class="festive-layer" aria-hidden="true">
  <span class="floaty" style="left:4%;top:12%;--dur:2.8s">🧧</span>
  <span class="floaty small" style="left:14%;top:62%;--dur:2.4s">🪙</span>
  <span class="floaty" style="left:24%;top:22%;--dur:3.2s">🧧</span>
  <span class="floaty small" style="left:82%;top:18%;--dur:2.2s">🪙</span>
  <span class="floaty" style="left:91%;top:58%;--dur:3.1s">🧧</span>
  <span class="floaty small" style="left:72%;top:74%;--dur:2.7s">🏮</span>
  <span class="floaty" style="left:46%;top:8%;--dur:3.4s">💰</span>
</div>
<header>
  <div>
    <div style="font-weight:900">Blind Auction Party</div>
    <div class="small">Google Sheet 當 DB / Apps Script 當 API</div>
  </div>
  <div class="small mono" id="apiUrlText"></div>
</header>

<main>
  <div class="status">
    <span class="pill">狀態</span>
    <span class="small" id="statusText">初始化中…</span>
  </div>

  <div style="height:12px"></div>

  <!-- LOBBY -->
  <section class="grid2" id="viewLobby">
    <div class="card">
      <h3>大廳</h3>

      <label>房名 / 同場域代碼（lobbyCode）</label>
      <input id="lobbyCode" placeholder="例如：PARTY01" autocomplete="off"/>

      <label>你的名字</label>
      <input id="playerName" placeholder="例如：Jack" autocomplete="off"/>

      <div class="row" style="margin-top:12px">
        <button id="btnCreateRoom">開新房間</button>
        <button id="btnRefresh" class="secondary">刷新房間列表</button>
        <button id="btnSetup" class="secondary">初始化DB</button>
        <button id="btnDebug" class="secondary">測試API</button>
      </div>

      <div class="hint" id="lobbyError" style="display:none"></div>

      <div style="height:12px"></div>

      <label>用 roomId 直接加入</label>
      <div class="row">
        <input id="joinRoomId" class="mono" placeholder="例如：0123" style="flex:1;min-width:220px" autocomplete="off"/>
        <button id="btnJoinRoom" class="secondary">加入</button>
      </div>

      <div class="hint">
        Debug 提醒：若 API 回傳 HTML（登入頁/權限頁），此頁會顯示「API 回傳 HTML」而不是炸 JSON.parse。
      </div>
    </div>

    <div class="card">
      <h3>房間列表</h3>
      <table>
        <thead><tr><th>roomId</th><th>state</th><th>人數</th><th>回合</th><th></th></tr></thead>
        <tbody id="roomsTbody"><tr><td colspan="5" class="small">尚未載入</td></tr></tbody>
      </table>
    </div>
  </section>

  <!-- ROOM -->
  <section class="grid2" id="viewRoom" style="display:none">
    <div class="card">
      <h3>房間</h3>
      <div class="row">
        <span class="pill">roomId</span>
        <span class="mono" id="roomIdText"></span>
        <span style="margin-left:auto"></span>
        <button id="btnResetDb" class="danger" style="display:none">重置資料庫（Host）</button>
        <button id="btnLeave" class="secondary">離開</button>
      </div>

      <div style="height:10px"></div>

      <div class="row">
        <span class="pill">state</span><b id="roomStateText">-</b>
        <span class="pill">round</span><b id="roomRoundText">-</b>
      </div>

      <div style="height:10px"></div>

      <div class="row">
        <span class="pill">你</span><b id="meNameText">-</b>
        <span class="pill">budget</span><b id="meBudgetText">-</b>
        <span class="pill">score</span><b id="meScoreText">-</b>
      </div>

      <div style="height:12px"></div>

      <div id="bidBox" style="display:none">
        <div class="small">本回合物品：<b id="itemNameText"></b></div>
        <div class="hint" id="itemHintText"></div>
        <div class="hint" id="deadlineText"></div>

        <label>出價</label>
        <div class="row">
          <input id="bidInput" type="number" min="0" step="1" style="width:160px" placeholder="例如：12"/>
          <button id="btnBid">送出出價</button>
          <button id="btnResolve" class="danger" style="display:none">結算（Host）</button>
        </div>
      </div>

      <div style="height:10px"></div>
      <button id="btnStartRound" class="secondary" style="display:none">開始回合（Host）</button>

      <div class="hint bad" id="roomError" style="display:none"></div>
    </div>

    <div class="card">
      <h3>玩家</h3>
      <div id="playersBox" class="small">-</div>

      <div style="height:12px"></div>
      <h3>Debug</h3>
      <div class="log" id="debugLog"></div>
    </div>
  </section>
</main>

<script>
  // ===== API URL =====
  // 優先使用後端在 template 注入的 apiBaseUrl，避免 iframe/googleusercontent URL 造成「拿到 HTML 不是 JSON」。
  // 其次可用 ?api=... 強制覆寫，方便除錯或切換不同部署。
  // 最後才 fallback 到目前網址推導（兼容本地靜態測試）。
  const TEMPLATE_API_BASE = "<?= apiBaseUrl ?>";

  function isTemplatePlaceholder(s){
    return /<\?=\s*apiBaseUrl\s*\?>/i.test(String(s||""));
  }

  function computeApiUrl(){
    const byTemplate = String(TEMPLATE_API_BASE || "").trim();
    // 本地直接開 index.html 時，template 不會被 Apps Script 轉換，
    // 會留下原樣 "<?= apiBaseUrl ?>"，這不是合法 URL，fetch 會拋 NetworkError。
    // 因此要先排除模板佔位字串，再決定是否採用。
    if (byTemplate && !isTemplatePlaceholder(byTemplate)) return byTemplate;

    const u = new URL(window.location.href);
    const byQuery = (u.searchParams.get("api") || "").trim();
    if (byQuery) return byQuery;

    u.hash = "";
    u.searchParams.delete("api");
    const path = u.pathname.endsWith("/dev") ? u.pathname.replace(/\/dev$/,"/exec") : u.pathname;
    return u.origin + path;
  }
  const API_URL = computeApiUrl();
  document.getElementById("apiUrlText").textContent = "API: " + API_URL;

  const S = {
    roomId: "",
    playerId: "",
    hostToken: "",
    name: "",
    sinceEventId: 0,
    syncing: false,   // single-flight
    stop: false,
    preferJsonp: false
  };

  const UI = {
    lobbyLoading: false
  };

  function setStatus(ok, msg){
    const el = document.getElementById("statusText");
    el.textContent = msg;
    el.className = ok ? "small ok" : "small bad";
  }

  function showErr(id, msg){
    const el = document.getElementById(id);
    if (!msg) { el.style.display="none"; el.textContent=""; return; }
    el.style.display="";
    el.textContent = msg;
  }

  function log(msg){
    const box = document.getElementById("debugLog");
    box.textContent = (box.textContent + "\n" + msg).trim();
    const lines = box.textContent.split("\n");
    if (lines.length > 220) box.textContent = lines.slice(lines.length-220).join("\n");
    box.scrollTop = box.scrollHeight;
  }

  function looksLikeHtml(t){
    const raw = String(t||"").trim();
    const s = raw.toLowerCase();
    return s.startsWith("<!doctype") || s.startsWith("<html") || s.includes("<head") || s.includes("<body") || s.includes("iframe#userhtmlframe");
  }

  function randomJsonpCallbackName(){
    return "__BAP_JSONP_" + Date.now() + "_" + Math.random().toString(36).slice(2, 10);
  }

  function apiGETJsonp(action, params={}){
    return new Promise((resolve, reject)=>{
      const u = new URL(API_URL);
      const callbackName = randomJsonpCallbackName();
      u.searchParams.set("action", action);
      u.searchParams.set("callback", callbackName);
      for (const [k,v] of Object.entries(params)){
        if (v===undefined || v===null || v==="") continue;
        u.searchParams.set(k, String(v));
      }

      const script = document.createElement("script");
      let done = false;
      const timeout = setTimeout(()=> finish(new Error("JSONP timeout")), 12000);

      function cleanup(){
        clearTimeout(timeout);
        if (script.parentNode) script.parentNode.removeChild(script);
        try { delete window[callbackName]; } catch(_) { window[callbackName] = undefined; }
      }

      function finish(err, data){
        if (done) return;
        done = true;
        cleanup();
        if (err) reject(err);
        else resolve(data);
      }

      window[callbackName] = (data)=> finish(null, data);
      script.onerror = ()=> finish(new Error("JSONP script load failed"));
      script.src = u.toString();
      document.head.appendChild(script);
    });
  }

  function must(s, name){
    s = String(s||"").trim();
    if (!s) throw new Error("請填入：" + name);
    return s;
  }

  function normalizeLobbyCode(s){
    s = String(s||"").trim();
    if (!s) return "";
    // 允許「房名」使用中文/英文/數字；英文統一轉大寫，移除空白
    // 避免原本只保留 A-Z0-9 導致輸入中文時變成空字串、看起來像按鈕沒反應。
    s = s.replace(/\s+/g, "").replace(/[a-z]/g, c => c.toUpperCase());
    return s.length >= 2 ? s.slice(0,16) : "";
  }

  function isNetworkLikeError(err){
    const m = String(err && err.message ? err.message : err || "").toLowerCase();
    return m.includes("networkerror") || m.includes("failed to fetch") || m.includes("load failed") || m.includes("fetch");
  }

  async function apiGET(action, params={}){
    if (S.preferJsonp) return apiGETJsonp(action, params);
    const u = new URL(API_URL);
    u.searchParams.set("action", action);
    for (const [k,v] of Object.entries(params)){
      if (v===undefined || v===null || v==="") continue;
      u.searchParams.set(k, String(v));
    }
    try {
      const res = await fetch(u.toString(), { method:"GET", credentials:"include" });
      const text = await res.text();
      if (looksLikeHtml(text)) throw new Error("API 回傳 HTML（權限/登入導向/部署設定）。前 200 字：\n" + text.slice(0,200));
      try { return JSON.parse(text); }
      catch(_) { throw new Error("API 回傳非 JSON。前 200 字：\n" + text.slice(0,200)); }
    } catch (err){
      // 在本地 file:// 或跨來源靜態頁，fetch 可能直接丟 TypeError: NetworkError。
      // 自動改用 JSONP（需後端支援 callback）。
      log("GET_FALLBACK_JSONP action=" + action + " reason=" + String(err && err.message ? err.message : err));
      if (isNetworkLikeError(err)) S.preferJsonp = true;
      return apiGETJsonp(action, params);
    }
  }

  async function apiPOST(action, payload={}){
    try {
      const res = await fetch(API_URL, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        credentials:"include",
        body: JSON.stringify({ action, ...payload })
      });
      const text = await res.text();
      if (looksLikeHtml(text)){
        // Apps Script 可能在 POST 時被 302 轉址，導致 body 遺失並回傳 HTML。
        // 遇到此情況自動改走 GET + query payload。
        log("POST_FALLBACK_GET action=" + action);
        return apiGET(action, payload);
      }
      try { return JSON.parse(text); }
      catch(_) { throw new Error("API 回傳非 JSON。前 200 字：\n" + text.slice(0,200)); }
    } catch (err){
      // 在本地 file:// 或跨來源靜態頁，POST fetch 可能直接拋 NetworkError。
      // 與 GET 一樣改走 query + JSONP fallback，避免「API OK 但 createRoom 失敗」。
      log("POST_FALLBACK_GET action=" + action + " reason=" + String(err && err.message ? err.message : err));
      return apiGET(action, payload);
    }
  }

  function showLobby(){
    document.getElementById("viewLobby").style.display="";
    document.getElementById("viewRoom").style.display="none";
    stopSync();
  }

  function showRoom(){
    document.getElementById("viewLobby").style.display="none";
    document.getElementById("viewRoom").style.display="";
  }

  function renderRooms(rooms){
    const tb = document.getElementById("roomsTbody");
    tb.innerHTML="";
    if (!rooms.length){
      tb.innerHTML = `<tr><td colspan="5" class="small">沒有活躍房間</td></tr>`;
      return;
    }
    for (const r of rooms){
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="mono">${r.roomId}</td>
        <td>${r.state}</td>
        <td>${r.playerCount||0}</td>
        <td>${r.round||0}/${r.maxRounds||0}</td>
        <td><button class="secondary">加入</button></td>
      `;
      tr.querySelector("button").onclick = ()=> joinRoomById(r.roomId);
      tb.appendChild(tr);
    }
  }

  function setLobbyLoading(v){
    UI.lobbyLoading = !!v;
    document.getElementById("btnRefresh").disabled = UI.lobbyLoading;
    document.getElementById("btnCreateRoom").disabled = UI.lobbyLoading;
    document.getElementById("btnJoinRoom").disabled = UI.lobbyLoading;
  }

  async function refreshLobby(){
    showErr("lobbyError","");
    if (UI.lobbyLoading) return;
    const lobbyCode = normalizeLobbyCode(document.getElementById("lobbyCode").value);
    if (!lobbyCode) {
      showErr("lobbyError","房名至少 2 個字（可用中文/英文/數字）");
      setStatus(false,"請先填房名");
      return;
    }
    setLobbyLoading(true);
    try {
      setStatus(true,"載入房間列表…");
      const out = await apiGET("listLobbyRooms", { lobbyCode });
      if (!out.ok) throw new Error(out.error || "listLobbyRooms failed");
      renderRooms(out.rooms || []);
      setStatus(true,"大廳就緒");
    } finally {
      setLobbyLoading(false);
    }
  }

  async function createRoom(){
    showErr("lobbyError","");
    const lobbyCode = normalizeLobbyCode(must(document.getElementById("lobbyCode").value,"房名/同場域代碼"));
    if (!lobbyCode) throw new Error("房名至少 2 個字（可用中文/英文/數字）");
    const name = must(document.getElementById("playerName").value,"你的名字").slice(0,18);

    setStatus(true,"建立房間…");
    const cr = await apiPOST("createRoom", { lobbyCode });
    if (!cr.ok) throw new Error(cr.error || "createRoom failed");

    const jr = await apiPOST("joinRoom", { roomId: cr.roomId, name });
    if (!jr.ok) throw new Error(jr.error || "joinRoom failed");

    S.roomId = cr.roomId;
    S.hostToken = cr.hostToken || "";
    S.playerId = jr.playerId || "";
    S.name = name;
    S.sinceEventId = 0;

    enterRoom();
  }

  async function joinRoomById(roomId){
    showErr("lobbyError","");
    const name = must(document.getElementById("playerName").value,"你的名字").slice(0,18);
    roomId = must(roomId,"roomId").trim();

    setStatus(true,"加入房間…");
    const jr = await apiPOST("joinRoom", { roomId, name });
    if (!jr.ok) throw new Error(jr.error || "joinRoom failed");

    S.roomId = roomId;
    S.hostToken = "";   // 一般玩家
    S.playerId = jr.playerId || "";
    S.name = name;
    S.sinceEventId = 0;

    enterRoom();
  }

  function enterRoom(){
    showRoom();
    document.getElementById("roomIdText").textContent = S.roomId;
    document.getElementById("meNameText").textContent = S.name;
    document.getElementById("debugLog").textContent = "";
    showErr("roomError","");
    startSync();
  }

  async function sendBid(){
    showErr("roomError","");
    const bid = Number(document.getElementById("bidInput").value);
    if (!Number.isFinite(bid) || bid < 0) throw new Error("出價必須是 >=0 的數字");
    const round = Number(document.getElementById("roomRoundText").textContent || 0);
    const out = await apiPOST("bid", { roomId:S.roomId, playerId:S.playerId, round, bid });
    if (!out.ok) throw new Error(out.error || "bid failed");
  }

  async function startRoundHost(){
    showErr("roomError","");
    const out = await apiPOST("startRound", { roomId:S.roomId, hostToken:S.hostToken, playerId:S.playerId });
    if (!out.ok) throw new Error(out.error || "startRound failed");
  }

  async function resolveHost(){
    showErr("roomError","");
    const out = await apiPOST("resolve", { roomId:S.roomId, hostToken:S.hostToken, playerId:S.playerId });
    if (!out.ok) throw new Error(out.error || "resolve failed");
  }

  async function resetDatabaseAsHost(){
    showErr("roomError", "");
    if (!S.hostToken) throw new Error("只有房主可以重置資料庫");
    const ok = window.confirm("確定要重置整個資料庫嗎？所有房間與玩家資料都會清空。");
    if (!ok) return;

    setStatus(true, "重置資料庫中…");
    const out = await apiPOST("resetDatabase", { roomId:S.roomId, hostToken:S.hostToken });
    if (!out.ok) throw new Error(out.error || "resetDatabase failed");

    showLobby();
    S.roomId = "";
    S.playerId = "";
    S.hostToken = "";
    S.sinceEventId = 0;
    document.getElementById("roomsTbody").innerHTML = `<tr><td colspan="5" class="small">尚未載入</td></tr>`;
    setStatus(true, "資料庫已重置");
  }

  function stopSync(){ S.stop = true; }

  function startSync(){
    S.stop = false;
    (async function loop(){
      while(!S.stop){
        try { await syncOnce(); }
        catch(err){
          showErr("roomError", String(err.message||err));
          setStatus(false,"同步失敗");
          log("SYNC_ERR:\n" + String(err.message||err));
          await new Promise(r=>setTimeout(r,2500));
        }
        await new Promise(r=>setTimeout(r,1200));
      }
    })();
  }

  async function syncOnce(){
    if (S.syncing) return;
    S.syncing = true;
    try{
      const out = await apiGET("sync", {
        roomId:S.roomId,
        sinceEventId:S.sinceEventId,
        playerId:S.playerId,
        hostToken:S.hostToken
      });
      if (!out.ok) throw new Error(out.error || "sync failed");

      const room = out.room;
      const players = out.players || [];
      const events = out.events || [];

      document.getElementById("roomStateText").textContent = room.state;
      document.getElementById("roomRoundText").textContent = String(room.round||0);

      const me = players.find(p=>p.playerId===S.playerId);
      document.getElementById("meBudgetText").textContent = me ? String(me.budget) : "-";
      document.getElementById("meScoreText").textContent = me ? String(me.score) : "-";

      document.getElementById("playersBox").textContent =
        players.map(p=>`${p.name}  budget=${p.budget} score=${p.score}${p.isHost?" (host)":""}`).join("\n") || "-";

      const bidBox = document.getElementById("bidBox");
      if (room.state === "BIDDING" && room.item){
        bidBox.style.display="";
        document.getElementById("itemNameText").textContent = room.item.name || "";
        document.getElementById("itemHintText").textContent = room.item.publicHint || "";
        document.getElementById("deadlineText").textContent = "截止：" + (room.bidDeadlineTs||0);
      } else {
        bidBox.style.display="none";
      }

      const amHost = !!(S.hostToken || (me && me.isHost));
      document.getElementById("btnStartRound").style.display = (amHost && room.state==="LOBBY") ? "" : "none";
      document.getElementById("btnResolve").style.display = (amHost && room.state==="BIDDING") ? "" : "none";
      document.getElementById("btnResetDb").style.display = S.hostToken ? "" : "none";

      if (events.length){
        const maxId = Math.max(...events.map(e=>Number(e.eventId||0)));
        if (Number.isFinite(maxId) && maxId > S.sinceEventId) S.sinceEventId = maxId;
        events.forEach(ev=>log(`#${ev.eventId} ${ev.type} ${ev.playerId||""} ${ev.payloadJson||""}`));
      }

      setStatus(true,"同步中… " + room.state);
    } finally {
      S.syncing = false;
    }
  }

  // ===== UI buttons =====
  document.getElementById("btnRefresh").onclick = async ()=>{
    try { await refreshLobby(); }
    catch(err){ showErr("lobbyError", String(err.message||err)); setStatus(false,"刷新失敗"); log("REFRESH_ERR:\n"+String(err.message||err)); }
  };

  document.getElementById("btnCreateRoom").onclick = async ()=>{
    try { await createRoom(); }
    catch(err){ showErr("lobbyError", String(err.message||err)); setStatus(false,"建立失敗"); log("CREATE_ERR:\n"+String(err.message||err)); }
  };

  document.getElementById("btnJoinRoom").onclick = async ()=>{
    try { await joinRoomById(document.getElementById("joinRoomId").value); }
    catch(err){ showErr("lobbyError", String(err.message||err)); setStatus(false,"加入失敗"); log("JOIN_ERR:\n"+String(err.message||err)); }
  };

  document.getElementById("btnLeave").onclick = ()=> { showLobby(); setStatus(true,"回到大廳"); };

  document.getElementById("btnBid").onclick = async ()=>{
    try { await sendBid(); }
    catch(err){ showErr("roomError", String(err.message||err)); setStatus(false,"出價失敗"); log("BID_ERR:\n"+String(err.message||err)); }
  };

  document.getElementById("btnStartRound").onclick = async ()=>{
    try { await startRoundHost(); }
    catch(err){ showErr("roomError", String(err.message||err)); setStatus(false,"開始回合失敗"); log("START_ROUND_ERR:\n"+String(err.message||err)); }
  };

  document.getElementById("btnResolve").onclick = async ()=>{
    try { await resolveHost(); }
    catch(err){ showErr("roomError", String(err.message||err)); setStatus(false,"結算失敗"); log("RESOLVE_ERR:\n"+String(err.message||err)); }
  };

  document.getElementById("btnResetDb").onclick = async ()=>{
    try { await resetDatabaseAsHost(); }
    catch(err){ showErr("roomError", String(err.message||err)); setStatus(false,"重置失敗"); log("RESET_DB_ERR:\n"+String(err.message||err)); }
  };

  // 初始化DB（不必進 Apps Script 手動 Run）
  document.getElementById("btnSetup").onclick = async ()=>{
    showErr("lobbyError","");
    try{
      setStatus(true,"初始化DB…");
      const out = await apiPOST("setup", {});
      if (!out.ok) throw new Error(out.error || "setup failed");
      setStatus(true,"初始化完成（Rooms/Players/Events/Items/PlayerCards 應該出現）");
    }catch(err){
      setStatus(false,"初始化失敗");
      showErr("lobbyError", String(err.message||err));
      log("SETUP_ERR:\n"+String(err.message||err));
    }
  };

  // 測試 API：debugInfo
  document.getElementById("btnDebug").onclick = async ()=>{
    showErr("lobbyError","");
    try{
      setStatus(true,"測試 API…");
      const out = await apiGET("debugInfo", {});
      if (!out.ok) throw new Error(out.error || "debugInfo failed");
      setStatus(true,"API OK（已回 JSON）");
      log("DEBUG_OK:\n"+JSON.stringify(out, null, 2));
    }catch(err){
      setStatus(false,"API 測試失敗");
      showErr("lobbyError", String(err.message||err));
      log("DEBUG_ERR:\n"+String(err.message||err));
    }
  };

  // ===== init =====
  (function initFromUrl(){
    try{
      const u = new URL(window.location.href);
      const rid = u.searchParams.get("roomId");
      if (rid) document.getElementById("joinRoomId").value = rid;
    }catch(_){}
    setStatus(true,"大廳就緒");
  })();

  // 全域攔截：避免「看起來不能動但其實在爆錯」
  window.addEventListener("unhandledrejection", (e)=>{
    setStatus(false,"前端 Promise 例外");
    const msg = String(e.reason?.message || e.reason || "unknown");
    showErr("lobbyError", msg);
    log("UNHANDLED_REJECTION:\n"+msg);
  });
  window.addEventListener("error", (e)=>{
    setStatus(false,"前端錯誤");
    const msg = String(e.message || "unknown");
    showErr("lobbyError", msg);
    log("WINDOW_ERROR:\n"+msg);
  });
</script>
</body>
</html>
